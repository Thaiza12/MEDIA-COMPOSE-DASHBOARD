# redis_config/redis.conf
# Persistência básica — salva a cada 60s se houver 1 mudança
save 60 1
save 300 10

# Arquivo de dados
dbfilename dump.rdb
dir /data

# Log
loglevel notice

# Memória máxima (ajustar conforme servidor)
maxmemory 256mb
maxmemory-policy allkeys-lru

# Habilita notificações de keyspace (para Pub/Sub futuro)
notify-keyspace-events Ex